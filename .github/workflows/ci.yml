name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: civicforest
          POSTGRES_USER: civicforest
          POSTGRES_PASSWORD: civicforest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicforest -d civicforest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Postgres, not the SQLite offline fallback, so PG-specific behaviour is exercised.
      # USE_SQLITE is deliberately unset here.
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://civicforest:civicforest@localhost:5432/civicforest
      DJANGO_SECRET_KEY: ci-insecure-test-key
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      # Fail the build on a known-vulnerable Python dependency.
      - run: uv run pip-audit --strict --desc
