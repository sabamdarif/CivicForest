[project]
name = "civicforest-backend"
version = "0.1.0"
description = "CivicForest storefront API — Django + DRF"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "django-allauth[socialaccount,mfa]>=65.0",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "django-filter>=24.3",
    "drf-spectacular>=0.27",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "django-celery-beat>=2.7",
    "meilisearch>=0.31",
    "pillow>=10.4",
    "filetype>=1.2",
    "gunicorn>=23.0",
    "uvicorn>=0.30",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "faker>=30.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
# DJ001: null=True on string fields — allowed selectively where intentional.
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"
