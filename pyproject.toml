[project]
name = "civicforest"
version = "0.1.0"
description = "CivicForest Clothing storefront: Django, DRF and Jinja2 on one Vercel deployment"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.17,<6.0",
    "djangorestframework>=3.17.2",
    "django-allauth[socialaccount,mfa]==65.19.1",
    "django-environ>=0.11",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
    "resend>=2.42",
    "pillow>=10.4",
    "filetype>=1.2",
    "whitenoise>=6.7",
    "django-storages[s3]>=1.14",
    "boto3>=1.35",
    "sentry-sdk[django]>=2.14",
    "django-auditlog>=3.0",
    "python-json-logger>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "faker>=30.0",
    "pip-audit>=2.7",
]

# Vercel resolves the entrypoint from WSGI_APPLICATION, but naming it here keeps the
# choice explicit: ASGI would win if config/asgi.py ever came back.
# No [tool.vercel.scripts]: collectstatic runs automatically and nothing else builds.
[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
# DJ001: null=True on string fields — allowed selectively where intentional.
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"
